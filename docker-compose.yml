version: '3.8'

services:
  frontend:
    build: ./oryzawatch_frontend
    ports:
      - "3000:80"   # access frontend at http://localhost:3000
    restart: unless-stopped
    # optional volume for live edits during development
    volumes:
      - ./oryzawatch_frontend:/app

  mobile:
    build: ./oryzawatch_mobile
    ports:
      - "19000:19000"  # Expo app
      - "19001:19001"  # Expo devtools
      - "8081:8081"    # Metro
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
    volumes:
      - ./oryzawatch_mobile:/app
    command: npm start

# Notes:
# - On Windows, device connection to the Expo server sometimes requires using the "Tunnel" option in Expo or
#   configuring the host networking appropriately. For building native APKs/APKs in CI, additional native toolchains are required.
