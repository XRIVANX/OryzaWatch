server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # try files, otherwise serve index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # disable access logs for small containers
  access_log off;
  error_log /var/log/nginx/error.log warn;
}
